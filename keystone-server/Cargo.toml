[package]
name = "keystone-server"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Server-authoritative licensing server: exchange, attest, heartbeat, session-gated payloads, revocation."

[features]
default = ["cli"]
cli = ["dep:tracing-subscriber"]

[[bin]]
name = "keystone-server"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
keystone-core = { path = "../keystone-core", version = "0.2.0" }
arc-swap = "1"
argon2 = "0.5"
async-trait = "0.1"
axum = "0.7"
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
hmac = "0.12"
http-body-util = "0.1"
parking_lot = "0.12"
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
rustls-webpki = { version = "0.103", default-features = false, features = ["std"] }
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["serde"] }

[dev-dependencies]
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots"] }
tower = { version = "0.5", features = ["util"] }
