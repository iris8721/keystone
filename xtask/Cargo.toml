[package]
name = "xtask"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
keystone-core = { path = "../keystone-core" }
anyhow = "1"
argon2 = "0.5"
chrono = "0.4"
hex = "0.4"
rand = "0.8"
rpassword = "7"
rcgen = { version = "0.13", features = ["x509-parser"] }
rustls-webpki = "0.103"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
base64 = "0.22"

