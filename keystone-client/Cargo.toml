[package]
name = "keystone-client"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Client SDK for keystone: exchange, handoff, attest, keepalive, session gates, verified payload downloads, admin revocation."

[dependencies]
keystone-core = { path = "../keystone-core", version = "0.2.0" }
chrono = "0.4"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = "1"
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["rt", "time"] }
uuid = "1"
webpki-roots = "1"
zeroize = "1"

[dev-dependencies]
async-trait = "0.1"
axum = "0.7"
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
futures-util = "0.3"
keystone-server = { path = "../keystone-server", default-features = false }
parking_lot = "0.12"
rcgen = "0.13"
tokio = { version = "1", features = ["full"] }
