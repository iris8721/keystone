# Keystone build/deploy configuration. Edit for your dev setup.
#
# Run everything through:  cargo xtask <cmd>
#   cargo xtask keygen --key-id 1   — issuer keyfile (keystone-1.key), prints the pinned pubkey
#   cargo xtask ca                  — keystone CA (mTLS root)
#   cargo xtask cert [--host H]     — server TLS cert, prints the SPKI pin
#   cargo xtask issue-cert <acct>   — client cert, pinned on the account
#   cargo xtask dev                 — provision anything missing, then run the server

[target]
# Machine that runs keystone-server in deployed setups. Deploy uses
# ssh/scp, so the host needs an SSH server and a POSIX shell.
host = "192.0.2.10"
username = "keystone"

[deploy]
# Directory on the target that receives the binary, key material,
# accounts, revocations, and keystone.env.
remote_path = "/opt/keystone"

[paths]
# Locations relative to this file.
keyfile = "keystone-1.key"
cert = "keystone-cert.pem"
cert_key = "keystone-key.pem"
ca_cert = "keystone-ca-cert.pem"
ca_key = "keystone-ca-key.pem"
payload_secret = "payload.secret"
payload_dir = "payloads"
accounts = "accounts.json"
revocations = "revoked-keys.json"
